# ==========================
# Server
# ==========================
server.port=8085
spring.application.name=Expense-Tracking-System

# ==========================
# Datasource (Supabase PostgreSQL)
# ==========================
spring.datasource.url=jdbc:postgresql://db.tourzgafriszkwvahtwu.supabase.co:5432/postgres?sslmode=require
spring.datasource.username=postgres
spring.datasource.password=Sudip%402560  # '@' replaced with %40
spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================
# JPA / Hibernate
# ==========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================
# Thymeleaf
# ==========================
spring.thymeleaf.enabled=true
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ==========================
# Logging
# ==========================
logging.level.org.thymeleaf=DEBUG

# ==========================
# Email Configuration (Gmail)
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=sudipmanandhar2560@gmail.com
spring.mail.password=nbqi frdv kszx nela  # Your app password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# ==========================
# Misc
# ==========================
spring.main.allow-circular-references=true







